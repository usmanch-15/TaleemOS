name: taleemos
description: TaleemOS - Complete School Management SaaS Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ============================================
  # BACKEND — Supabase
  # ============================================
  supabase_flutter: ^2.5.6

  # ============================================
  # STATE MANAGEMENT & ROUTING
  # ============================================
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # ============================================
  # CORE UTILITIES
  # ============================================
  equatable: ^2.0.5
  intl: ^0.19.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1

  # ============================================
  # FILE / IMAGE HANDLING
  # ============================================
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  cached_network_image: ^3.4.1

  # ============================================
  # PDF GENERATION (report cards, receipts)
  # ============================================
  pdf: ^3.11.1
  printing: ^5.13.3
  path_provider: ^2.1.4

  # ============================================
  # CSV IMPORT/EXPORT (students, reports)
  # ============================================
  csv: ^6.0.0

  # ============================================
  # SHARING
  # ============================================
  share_plus: ^10.0.2

  # ============================================
  # PUSH NOTIFICATIONS (Firebase — delivery only, data stays in Supabase)
  # ============================================
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2

  # ============================================
  # UI HELPERS
  # ============================================
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/icons/

  # fonts:
